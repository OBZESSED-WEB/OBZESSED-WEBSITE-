<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>OBZESSED — Admin</title>

<link rel="stylesheet" href="styles.css">

<style>
.admin-page{
  min-height:100vh;
  background:var(--paper);
}

.admin-header{
  padding:25px 5%;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--paper);
}

.admin-brand{
  font-family:"Cormorant Garamond",serif;
  font-size:28px;
  letter-spacing:.12em;
}

.admin-brand span{
  display:block;
  font-family:Inter,sans-serif;
  font-size:8px;
  letter-spacing:.25em;
  text-align:center;
}

.admin-header a{
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
}

.admin-main{
  padding:60px 6%;
  max-width:1300px;
  margin:auto;
}

.admin-title{
  margin-bottom:40px;
}

.admin-title .eyebrow{
  margin-bottom:5px;
}

.admin-title h1{
  font-family:"Cormorant Garamond",serif;
  font-size:52px;
  margin:0;
}

.admin-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-bottom:55px;
}

.admin-stat{
  border:1px solid var(--line);
  background:#f0e5d5;
  padding:25px;
}

.admin-stat span{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.1em;
}

.admin-stat strong{
  display:block;
  font-family:"Cormorant Garamond",serif;
  font-size:38px;
  margin-top:8px;
}

.admin-section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:25px;
}

.admin-section-head h2{
  font-family:"Cormorant Garamond",serif;
  font-size:38px;
  margin:0;
}

.admin-products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.admin-product{
  background:#f0e5d5;
  border:1px solid var(--line);
}

.admin-product.inactive{
  opacity:.5;
}

.admin-product-image{
  aspect-ratio:1;
  background:#e8dccb;
  overflow:hidden;
}

.admin-product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.admin-product-info{
  padding:15px;
}

.admin-product-info h3{
  font-family:"Cormorant Garamond",serif;
  font-size:20px;
  margin:0 0 5px;
}

.admin-product-info p{
  color:var(--muted);
  font-size:10px;
  margin:5px 0;
}

.admin-actions{
  display:flex;
  gap:6px;
  margin-top:15px;
}

.admin-actions button{
  flex:1;
  border:1px solid var(--wine);
  background:transparent;
  color:var(--wine);
  padding:9px 5px;
  font-size:9px;
  font-weight:700;
  cursor:pointer;
}

.admin-actions button:hover{
  background:var(--wine);
  color:white;
}

.admin-empty{
  border:1px dashed var(--line);
  padding:60px;
  text-align:center;
  color:var(--muted);
  grid-column:1/-1;
}

.admin-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}

.admin-modal.open{
  display:flex;
}

.admin-form{
  background:var(--paper);
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  padding:35px;
  position:relative;
}

.admin-form h2{
  font-family:"Cormorant Garamond",serif;
  font-size:38px;
  margin-top:0;
}

.admin-form label{
  display:block;
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  margin-top:15px;
}

.admin-form input,
.admin-form textarea,
.admin-form select{
  width:100%;
  box-sizing:border-box;
  margin-top:7px;
  padding:12px;
  border:1px solid var(--line);
  background:white;
  font:inherit;
}

.admin-form textarea{
  min-height:90px;
  resize:vertical;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.form-buttons{
  display:flex;
  gap:10px;
  margin-top:25px;
}

.form-buttons button{
  flex:1;
}

.close-modal{
  position:absolute;
  right:18px;
  top:15px;
  border:0;
  background:none;
  font-size:28px;
  cursor:pointer;
}

.status{
  display:inline-block;
  margin-top:7px;
  padding:4px 7px;
  font-size:8px;
  font-weight:700;
  letter-spacing:.08em;
}

.status.active{
  background:#dfe9d9;
}

.status.inactive{
  background:#ead7d7;
}

@media(max-width:850px){
  .admin-grid{
    grid-template-columns:1fr;
  }

  .admin-products{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .admin-main{
    padding:40px 5%;
  }

  .admin-title h1{
    font-size:42px;
  }

  .admin-products{
    grid-template-columns:1fr;
  }

  .form-row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="admin-page">
  <div id="loginScreen" style="
  position:fixed;
  inset:0;
  background:var(--paper);
  z-index:10000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
">

  <div style="
    width:min(420px,100%);
    border:1px solid var(--line);
    padding:40px;
    background:#f0e5d5;
  ">

    <p class="eyebrow">OBZESSION CONTROL</p>

    <h1 style="
      font-family:'Cormorant Garamond',serif;
      font-size:42px;
      margin:0 0 25px;
    ">Admin Login</h1>

    <form id="loginForm">

      <label>
        EMAIL
        <input
          id="loginEmail"
          name="email"
          type="email"
          autocomplete="email"
          required
          
          
          
          style="width:100%;box-sizing:border-box;margin-top:7px;padding:12px;"
        >
      </label>

      <label style="display:block;margin-top:15px;">
        PASSWORD
        <input 
           id="loginPassword"
           name="password"
           type="password"
           autocomplete="current-password"
           required
          style="width:100%;box-sizing:border-box;margin-top:7px;padding:12px;"
        >
      </label>

      <button
        type="submit"
        class="btn"
        style="width:100%;margin-top:20px;"
      >
        LOGIN
      </button>

      <p id="loginError" style="
        color:#8b0000;
        font-size:11px;
        margin-top:15px;
      "></p>

    </form>

  </div>

</div>

<header class="admin-header">

  <div class="admin-brand">
    OBZESSED
    <span>by O&Z · ADMIN</span>
  </div>

  <a href="index.html">← BACK TO STORE</a>

</header>

<main class="admin-main">

  <div class="admin-title">
    <p class="eyebrow">OBZESSION CONTROL</p>
    <h1>Admin Dashboard</h1>
  </div>

  <div class="admin-grid">

    <div class="admin-stat">
      <span>PRODUCTS</span>
      <strong id="productCount">0</strong>
    </div>

    <div class="admin-stat">
      <span>ACTIVE</span>
      <strong id="activeCount">0</strong>
    </div>

    <div class="admin-stat">
      <span>IN STOCK</span>
      <strong id="stockCount">0</strong>
    </div>

  </div>

  <section>

    <div class="admin-section-head">

      <div>
        <p class="eyebrow">INVENTORY</p>
        <h2>Products</h2>
      </div>

      <button class="btn" onclick="openProductForm()">
        + ADD PRODUCT
      </button>

    </div>

    <div class="admin-products" id="adminProducts">
      <div class="admin-empty">Loading products...</div>
    </div>

  </section>

</main>

</div>


<!-- PRODUCT FORM -->

<div class="admin-modal" id="productModal">

  <div class="admin-form">

    <button class="close-modal" onclick="closeProductForm()">×</button>

    <p class="eyebrow">INVENTORY</p>

    <h2 id="formTitle">Add Product</h2>

    <form id="productForm">

      <input type="hidden" id="productId">

      <label>
        PRODUCT NAME
        <input id="name" required>
      </label>

      <label>
        DESCRIPTION
        <textarea id="description"></textarea>
      </label>

      <div class="form-row">

        <label>
          PRICE
          <input id="price" type="number" min="0" step="0.01" required>
        </label>

        <label>
          CATEGORY
          <select id="category" required>
            <option value="jacket">Jacket</option>
            <option value="hoodie">Hoodie</option>
            <option value="shirt">Shirt</option>
            <option value="pants">Pants</option>
            <option value="accessory">Accessory</option>
            <option value="other">Other</option>
          </select>
        </label>

      </div>

      <div class="form-row">

        <label>
          COLOUR
          <input id="color">
        </label>

        <label>
          STOCK
          <input id="stock" type="number" min="0" value="0">
        </label>

      </div>

      <label>
        IMAGE URL
        <input id="image_url" placeholder="https://...">
      </label>

      <label>
        SIZES
        <input id="sizes" placeholder="S, M, L, XL">
      </label>

      <label>
        <input id="is_active" type="checkbox" checked>
        PRODUCT IS ACTIVE
      </label>

      <div class="form-buttons">

        <button type="button" class="btn ghost" onclick="closeProductForm()">
          CANCEL
        </button>

        <button type="submit" class="btn">
          SAVE PRODUCT
        </button>

      </div>

    </form>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

let supabaseClient;
let products=[];
let currentUser=null;


/* CONNECT TO SUPABASE */

function connectSupabase(){

  if(typeof supabase==="undefined"){
    throw new Error("Supabase library failed to load.");
  }

  supabaseClient=supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

}


/* LOAD PRODUCTS */

async function loadAdminProducts(){

  const container=document.getElementById("adminProducts");

  container.innerHTML='<div class="admin-empty">Loading products...</div>';

  try{

    const {data,error}=await supabaseClient
      .from("products")
      .select("*")
      .order("created_at",{ascending:false});

    if(error) throw error;

    products=data||[];

    document.getElementById("productCount").textContent=products.length;

    document.getElementById("activeCount").textContent=
      products.filter(p=>p.is_active).length;

    document.getElementById("stockCount").textContent=
      products.reduce((total,p)=>total+(Number(p.stock)||0),0);

    renderAdminProducts();

  }catch(error){

    console.error(error);

    container.innerHTML=`
      <div class="admin-empty">
        <strong>Could not load products.</strong>
        <br><br>
        ${error.message}
      </div>
    `;

  }

}


/* DISPLAY PRODUCTS */

function renderAdminProducts(){

  const container=document.getElementById("adminProducts");

  if(!products.length){

    container.innerHTML=`
      <div class="admin-empty">
        No products yet.<br><br>
        Click "+ ADD PRODUCT" to create your first product.
      </div>
    `;

    return;

  }

  container.innerHTML=products.map(p=>`

    <article class="admin-product ${p.is_active ? "" : "inactive"}">

      <div class="admin-product-image">

        <img
          src="${p.image_url || "founders-jacket.svg"}"
          alt="${escapeHTML(p.name || "Product")}"
          onerror="this.src='founders-jacket.svg'"
        >

      </div>

      <div class="admin-product-info">

        <h3>${escapeHTML(p.name || "Unnamed Product")}</h3>

        <p>${escapeHTML(p.color || "")}</p>

        <p>${escapeHTML(p.category || "")}</p>

        <strong>R${Number(p.price || 0).toLocaleString("en-ZA")}</strong>

        <span class="status ${p.is_active ? "active" : "inactive"}">
          ${p.is_active ? "ACTIVE" : "INACTIVE"}
        </span>

        <div class="admin-actions">

          <button onclick="editProduct('${p.id}')">
            EDIT
          </button>

          <button onclick="toggleProduct('${p.id}')">
            ${p.is_active ? "HIDE" : "SHOW"}
          </button>

          <button onclick="deleteProduct('${p.id}')">
            DELETE
          </button>

        </div>

      </div>

    </article>

  `).join("");

}


/* ADD / EDIT FORM */

function openProductForm(product=null){

  document.getElementById("productModal").classList.add("open");

  document.getElementById("productForm").reset();

  document.getElementById("productId").value="";

  document.getElementById("is_active").checked=true;

  document.getElementById("formTitle").textContent=
    product ? "Edit Product" : "Add Product";

  if(product){

    document.getElementById("productId").value=product.id;
    document.getElementById("name").value=product.name||"";
    document.getElementById("description").value=product.description||"";
    document.getElementById("price").value=product.price||0;
    document.getElementById("category").value=product.category||"other";
    document.getElementById("color").value=product.color||"";
    document.getElementById("image_url").value=product.image_url||"";
    document.getElementById("stock").value=product.stock||0;
    document.getElementById("sizes").value=product.sizes||"";
    document.getElementById("is_active").checked=product.is_active!==false;

  }

}


function closeProductForm(){

  document.getElementById("productModal").classList.remove("open");

}


/* EDIT */

function editProduct(id){

  const product=products.find(p=>String(p.id)===String(id));

  if(product) openProductForm(product);

}


/* SAVE */

document.getElementById("productForm").addEventListener("submit",async function(e){

  e.preventDefault();

  const id=document.getElementById("productId").value;

  const productData={

    name:document.getElementById("name").value.trim(),

    description:document.getElementById("description").value.trim(),

    price:Number(document.getElementById("price").value)||0,

    category:document.getElementById("category").value,

    color:document.getElementById("color").value.trim(),

    image_url:document.getElementById("image_url").value.trim(),

    stock:Number(document.getElementById("stock").value)||0,

    sizes:document.getElementById("sizes").value.trim(),

    is_active:document.getElementById("is_active").checked

  };

  try{

    let result;

    if(id){

      result=await supabaseClient
        .from("products")
        .update(productData)
        .eq("id",id);

    }else{

      result=await supabaseClient
        .from("products")
        .insert(productData);

    }

    if(result.error) throw result.error;

    closeProductForm();

    await loadAdminProducts();

    alert(id ? "Product updated successfully." : "Product added successfully.");

  }catch(error){

    console.error(error);

    alert("Could not save product:\n\n"+error.message);

  }

});


/* SHOW / HIDE */

async function toggleProduct(id){

  const product=products.find(p=>String(p.id)===String(id));

  if(!product)return;

  try{

    const {error}=await supabaseClient
      .from("products")
      .update({is_active:!product.is_active})
      .eq("id",id);

    if(error)throw error;

    await loadAdminProducts();

  }catch(error){

    alert("Could not update product:\n\n"+error.message);

  }

}


/* DELETE */

async function deleteProduct(id){

  const product=products.find(p=>String(p.id)===String(id));

  if(!product)return;

  const confirmed=confirm(
    `Delete "${product.name}"?\n\nThis cannot be undone.`
  );

  if(!confirmed)return;

  try{

    const {error}=await supabaseClient
      .from("products")
      .delete()
      .eq("id",id);

    if(error)throw error;

    await loadAdminProducts();

  }catch(error){

    alert("Could not delete product:\n\n"+error.message);

  }

}


/* BASIC HTML SAFETY */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* START */

/* START */

async function startAdmin(){

  try{

    connectSupabase();

    const {data:{session}} = await supabaseClient.auth.getSession();

    if(session){

      currentUser=session.user;

      document.getElementById("loginScreen").style.display="none";

      await loadAdminProducts();

    }else{

      document.getElementById("loginScreen").style.display="flex";

    }

  }catch(error){

    console.error(error);

    document.getElementById("adminProducts").innerHTML=`
      <div class="admin-empty">
        <strong>Supabase connection failed.</strong>
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

  }

}


/* LOGIN */
const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", async function(e) {

  e.preventDefault();

  const emailInput = document.getElementById("loginEmail");
  const passwordInput = document.getElementById("loginPassword");
  const errorBox = document.getElementById("loginError");

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  errorBox.textContent = "";

  if (!email || !password) {
    errorBox.textContent = "Please enter your email and password.";
    return;
  }

  errorBox.textContent = "Logging in...";

  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      throw error;
    }

    currentUser = data.user;

    document.getElementById("loginScreen").style.display = "none";

    errorBox.textContent = "";

    await loadAdminProducts();

  } catch (error) {

    console.error("LOGIN ERROR:", error);

    errorBox.textContent = error.message || "Login failed.";

  }

});

startAdmin();
