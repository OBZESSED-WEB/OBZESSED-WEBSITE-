<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>OBZESSED — Admin</title>

<link rel="stylesheet" href="styles.css">

<style>
.admin-page{
  min-height:100vh;
  background:var(--paper);
}

.admin-header{
  padding:25px 5%;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--paper);
}

.admin-brand{
  font-family:"Cormorant Garamond",serif;
  font-size:28px;
  letter-spacing:.12em;
}

.admin-brand span{
  display:block;
  font-family:Inter,sans-serif;
  font-size:8px;
  letter-spacing:.25em;
  text-align:center;
}

.admin-header a{
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
}

.admin-main{
  padding:60px 6%;
  max-width:1300px;
  margin:auto;
}

.admin-title{
  margin-bottom:40px;
}

.admin-title .eyebrow{
  margin-bottom:5px;
}

.admin-title h1{
  font-family:"Cormorant Garamond",serif;
  font-size:52px;
  margin:0;
}

.admin-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-bottom:55px;
}

.admin-stat{
  border:1px solid var(--line);
  background:#f0e5d5;
  padding:25px;
}

.admin-stat span{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.1em;
}

.admin-stat strong{
  display:block;
  font-family:"Cormorant Garamond",serif;
  font-size:38px;
  margin-top:8px;
}

.admin-section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:25px;
}

.admin-section-head h2{
  font-family:"Cormorant Garamond",serif;
  font-size:38px;
  margin:0;
}

.admin-products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.admin-product{
  background:#f0e5d5;
  border:1px solid var(--line);
}

.admin-product-image{
  aspect-ratio:1;
  background:#e8dccb;
  overflow:hidden;
}

.admin-product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.admin-product-info{
  padding:15px;
}

.admin-product-info h3{
  font-family:"Cormorant Garamond",serif;
  font-size:20px;
  margin:0 0 5px;
}

.admin-product-info p{
  color:var(--muted);
  font-size:10px;
  margin:4px 0;
}

.admin-actions{
  display:flex;
  gap:6px;
  margin-top:15px;
}

.admin-actions button{
  flex:1;
  border:1px solid var(--wine);
  background:transparent;
  color:var(--wine);
  padding:9px 5px;
  font-size:9px;
  font-weight:700;
  cursor:pointer;
}

.admin-actions button:hover{
  background:var(--wine);
  color:white;
}

.admin-empty{
  border:1px dashed var(--line);
  padding:60px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:850px){
  .admin-grid{
    grid-template-columns:1fr;
  }

  .admin-products{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .admin-main{
    padding:40px 5%;
  }

  .admin-title h1{
    font-size:42px;
  }

  .admin-products{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="admin-page">

<header class="admin-header">

  <div class="admin-brand">
    OBZESSED
    <span>by O&Z · ADMIN</span>
  </div>

  <a href="index.html">← BACK TO STORE</a>

</header>

<main class="admin-main">

  <div class="admin-title">
    <p class="eyebrow">OBZESSION CONTROL</p>
    <h1>Admin Dashboard</h1>
  </div>

  <div class="admin-grid">

    <div class="admin-stat">
      <span>PRODUCTS</span>
      <strong id="productCount">0</strong>
    </div>

    <div class="admin-stat">
      <span>ORDERS</span>
      <strong>0</strong>
    </div>

    <div class="admin-stat">
      <span>SALES</span>
      <strong>R0</strong>
    </div>

  </div>

  <section>

    <div class="admin-section-head">

      <div>
        <p class="eyebrow">INVENTORY</p>
        <h2>Products</h2>
      </div>

      <button class="btn" onclick="alert('Add Product coming next!')">
        + ADD PRODUCT
      </button>

    </div>

    <div class="admin-products" id="adminProducts"></div>

  </section>

</main>

</div>

<script src="script.js"></script>

<script>

function loadAdminProducts(){

  const container=document.getElementById("adminProducts");

  document.getElementById("productCount").textContent=PRODUCTS.length;

  container.innerHTML=PRODUCTS.map(p=>`

    <article class="admin-product">

      <div class="admin-product-image">
        <img src="${p.img}" alt="${p.name}">
      </div>

      <div class="admin-product-info">

        <h3>${p.name}</h3>

        <p>${p.color}</p>

        <strong>${money(p.price)}</strong>

        <div class="admin-actions">

          <button onclick="alert('Product editing coming next!')">
            EDIT
          </button>

          <button onclick="alert('Photo management coming next!')">
            PHOTO
          </button>

        </div>

      </div>

    </article>

  `).join("");

}

loadAdminProducts();

</script>

</body>
</html>
